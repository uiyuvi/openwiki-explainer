<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OpenWiki Explainer</title>
    <meta name="description" content="An interactive explainer of OpenWiki: Git-Diff claim sync, packet traces, token economics, and architectural trade-offs." />
    <link rel="canonical" href="https://uiyuvi.github.io/openwiki-explainer/" />
    <meta property="og:title" content="OpenWiki Explainer" />
    <meta property="og:description" content="An interactive explainer of OpenWiki: Git-Diff claim sync, packet traces, token economics, and architectural trade-offs." />
    <meta property="og:url" content="https://uiyuvi.github.io/openwiki-explainer/" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="OpenWiki Explainer" />
    <meta name="twitter:description" content="An interactive explainer of OpenWiki: Git-Diff claim sync, packet traces, token economics, and architectural trade-offs." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,600&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#FFFFFF] text-[#09090B] min-h-screen antialiased selection:bg-black selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Safeguard if GitHub Pages temporarily serves the unbuilt source branch before the GitHub Actions Vite artifact finishes deploying
      (function () {
        if (!window.location.hostname.endsWith('github.io')) return;
        var rawEntry = document.querySelector('script[src*="/src/main.tsx"]');
        if (!rawEntry) return;
        setTimeout(function () {
          var root = document.getElementById('root');
          if (root && root.children.length === 0) {
            root.innerHTML =
              '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;font-family:\'JetBrains Mono\',monospace;background:#fff;color:#09090b;">' +
              '<div style="max-width:520px;width:100%;border:2px solid #09090b;padding:28px;box-shadow:6px 6px 0px #09090b;">' +
              '<div style="font-size:11px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:#52525b;margin-bottom:8px;">GITHUB PAGES ARTIFACT SYNC</div>' +
              '<div style="font-size:18px;font-weight:800;margin-bottom:12px;">Deploying compiled Vite bundle...</div>' +
              '<p style="font-size:13px;line-height:1.6;color:#3f3f46;margin:0 0 18px 0;">GitHub Actions is finalizing the production build artifact. This page will automatically refresh in a few seconds.</p>' +
              '<button onclick="window.location.href=window.location.pathname+\'?v=\'+Date.now()" style="background:#09090b;color:#fff;border:none;padding:10px 16px;font-family:inherit;font-size:12px;font-weight:700;cursor:pointer;text-transform:uppercase;letter-spacing:0.08em;">Refresh Now</button>' +
              '</div></div>';
            setTimeout(function () {
              window.location.replace(window.location.pathname + '?v=' + Date.now());
            }, 4000);
          }
        }, 1200);
      })();
    </script>
  </body>
</html>
