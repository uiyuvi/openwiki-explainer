name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_run:
    workflows: ["pages build and deployment"]
    types:
      - completed
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Sanitize any AI Studio local artifacts
        run: rm -rf .aistudio .tempmediaStorage public/assets/aistudio

      - name: Build project
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v4
        with:
          enablement: true
        continue-on-error: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Wait for default branch build (if active) before deploying
        if: github.event_name == 'push'
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Checking if default 'pages build and deployment' workflow is active..."
          sleep 12
          for i in $(seq 1 18); do
            ACTIVE=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/$GH_REPO/actions/runs?event=dynamic&per_page=5" | \
              node -e '
                try {
                  const data = JSON.parse(require("fs").readFileSync(0, "utf8"));
                  const busy = (data.workflow_runs || []).some(r =>
                    r.name === "pages build and deployment" &&
                    (r.status === "in_progress" || r.status === "queued" || r.status === "waiting" || r.status === "pending")
                  );
                  process.stdout.write(busy ? "yes" : "no");
                } catch (e) {
                  process.stdout.write("no");
                }
              ')
            if [ "$ACTIVE" = "no" ]; then
              echo "No active default branch deployment running. Proceeding after brief settle delay..."
              sleep 5
              break
            fi
            echo "Default 'pages build and deployment' is still running (attempt $i/18). Waiting 5s..."
            sleep 5
          done

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
